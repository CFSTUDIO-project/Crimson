name: Build Crimson

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate mod metadata
        run: python3 -m json.tool src/main/resources/fabric.mod.json > /dev/null
      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: crimson-${{ github.sha }}
          path: |
            build/libs/crimson-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
